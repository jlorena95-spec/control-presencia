<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#1f4e79"><title>Control de Presencia</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f6f8;color:#222}header{background:#1f4e79;color:#fff;padding:18px 16px;text-align:center}header h1{margin:0;font-size:22px}header p{margin:5px 0;font-size:13px}main{max-width:850px;margin:auto;padding:12px}.card{background:#fff;border-radius:12px;padding:14px;margin:10px 0;box-shadow:0 2px 8px #0001}.hour{font-size:18px;font-weight:bold;color:#1f4e79;margin:18px 4px 8px}.entity{display:flex;align-items:center;gap:8px;border:1px solid #ddd;border-radius:10px;padding:9px;margin:7px 0;background:#fff}.entity-name{flex:1;border:0;background:none;text-align:left;font-size:15px;font-weight:600;padding:5px;color:#174a73}.entity-info{font-size:12px;color:#666;min-width:95px;text-align:right}.state{border:0;border-radius:8px;padding:9px 10px;font-weight:bold;min-width:92px}.present{background:#d9f2df;color:#176b2c}.pending{background:#fff0c2;color:#7a5700}.na{background:#e8e8e8;color:#555}button{cursor:pointer}.topbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}.primary,.secondary,.danger{border:0;border-radius:9px;padding:10px 13px;font-weight:bold}.primary{background:#1f4e79;color:#fff}.secondary{background:#e9eef3;color:#1f4e79}.danger{background:#f6d6d6;color:#8a1f1f}#report{white-space:pre-wrap;font-size:15px;line-height:1.5}.modal-bg{display:none;position:fixed;inset:0;background:#0008;z-index:10;padding:15px;overflow:auto}.modal{background:#fff;max-width:650px;margin:30px auto;border-radius:14px;padding:18px}.modal h2{margin-top:0;color:#1f4e79}.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1;min-width:150px}label{display:block;font-size:13px;font-weight:bold;margin:10px 0 5px}input,select,textarea{width:100%;padding:10px;border:1px solid #bbb;border-radius:8px;font-size:15px}.listitem{display:flex;align-items:center;gap:8px;padding:8px;border-bottom:1px solid #eee}.listitem span{flex:1}.small{font-size:12px;color:#666}.search{margin-bottom:10px}.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#222;color:#fff;padding:11px 16px;border-radius:10px;display:none;z-index:30;font-weight:bold}@media(max-width:600px){.entity{flex-wrap:wrap}.entity-info{order:3;width:100%;text-align:left}.state{min-width:105px}}</style></head><body><header><h1>Control de Presencia</h1><p>Control diario de entidades</p></header><main><div class="topbar"><button class="primary" onclick="openTemplateSelector()">💬 Generar reporte</button><button class="secondary" onclick="settings()">⚙️ Configuración</button><button class="secondary" onclick="resetToday()">🔄 Reiniciar día</button></div><div id="date" class="small"></div><div id="entities"></div><div class="card"><h3>Reporte</h3><div id="report">Selecciona una plantilla para generar el mensaje.</div></div></main><div class="modal-bg" id="modalBg"><div class="modal" id="modal"></div></div><div class="toast" id="toast"></div><script>
const KEY='control_presencia_v3_config',TKEY='control_presencia_v3_templates',SKEY='control_presencia_v3_template',DAYKEY=d=>'control_presencia_v3_day_'+d;
const baseEntities=[['POSITIVA','7 al 9','07:00'],['GOBIERNO INSPECCIÓN','10 - sala 11','07:00'],['CAPITAL SALUD','11','07:00'],['ATENEA','Sala 12','07:00'],['CONVIVENCIA','13','07:30'],['CATASTRO','14','07:00'],['AMBIENTE','16','07:00'],['IDU','17','07:00'],['SALUD','18','07:00'],['GOBIERNO Certificacion','20','07:00'],['HACIENDA','15, 19, 21 al 23','07:00'],['PLANEACIÓN – NORMA URBANA','24','07:00'],['DIAN','25 al 36','08:00'],['PLANEACIÓN – SISBÉN','37 al 40','07:00'],['REGISTRADURÍA','41 al 44','08:00'],['ACUEDUCTO','45 al 47','07:00'],['VANTI','48, 51 al 52','07:00'],['ENEL','49 al 50, 53, 57','07:00'],['IDRD','54','07:00'],['HÁBITAT','55','07:00'],['FNA','56, 60','07:00'],['LIME','57 al 58','07:00'],['EDUCACIÓN','59','07:00'],['DPS','61 al 62','07:00'],['INTEGRACIÓN SOCIAL','63','07:30'],['U. MILITAR','64, sala 12','08:00'],['PERSONERÍA – ORIENTACIÓN','65 al 68, 71 al 72','07:00'],['PERSONERÍA – CONCILIACIÓN','69 al 70','07:00'],['COLPENSIONES','1 al 6, 12','08:00'],['REVAL S.A.S.','','07:00']].map((x,i)=>({id:i+1,name:x[0],location:x[1],time:x[2]}));
const baseTemplates=[{name:'Plantilla 7 am',text:'Buenos días, entidades de las 7 am pendientes por llegar:'},{name:'Plantilla 7:30 am',text:'Buenos días, entidades de las 7:30 am pendientes por llegar:'},{name:'Plantilla 8 am',text:'Buenos días, entidades de las 8 am pendientes por llegar:'},{name:'Reporte 7:15 am',text:'Entidades pendientes por llegar:'},{name:'Reporte 7:45 am',text:'Entidades pendientes por llegar:'}];
let config=loadConfig(),templates=loadTemplates(),today=getDay();function loadConfig(){try{let x=JSON.parse(localStorage.getItem(KEY));if(Array.isArray(x)&&x.length)return normalize(x)}catch(e){}return baseEntities.map(x=>({...x}))}function normalize(x){return x.map((e,i)=>({id:e.id??i+1,name:e.name||'',location:e.location||'',time:e.time||'07:00'}))}function loadTemplates(){try{let x=JSON.parse(localStorage.getItem(TKEY));if(Array.isArray(x)&&x.length)return x}catch(e){}return baseTemplates.map(x=>({...x}))}function saveConfig(){localStorage.setItem(KEY,JSON.stringify(config))}function saveTemplates(){localStorage.setItem(TKEY,JSON.stringify(templates))}function getDay(){return new Date().toISOString().slice(0,10)}function getState(){try{return JSON.parse(localStorage.getItem(DAYKEY(today)))||{}}catch(e){return {}}}function setState(s){localStorage.setItem(DAYKEY(today),JSON.stringify(s))}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function toast(t){let x=document.getElementById('toast');x.textContent=t;x.style.display='block';setTimeout(()=>x.style.display='none',1800)}function render(){today=getDay();document.getElementById('date').textContent='Fecha: '+today;let states=getState(),box=document.getElementById('entities');box.innerHTML='';let arr=[...config].sort((a,b)=>(a.time||'99:99').localeCompare(b.time||'99:99')||config.indexOf(a)-config.indexOf(b));let last='';arr.forEach(e=>{if(e.time!==last){last=e.time;let h=document.createElement('div');h.className='hour';h.textContent='🕐 '+formatTime(e.time);box.appendChild(h)}let st=states[e.id]?.state||'pending',wrap=document.createElement('div');wrap.className='entity';wrap.innerHTML=`<button class="entity-name" onclick="editEntity(${e.id})">${esc(e.name)}</button><div class="entity-info">${esc(e.location)}</div><button class="state ${st}" onclick="cycleState(${e.id})">${st==='present'?'✅ Presente':st==='na'?'🚫 N/A':'⏳ Pendiente'}</button>`;box.appendChild(wrap)})}function formatTime(t){let[h,m]=t.split(':').map(Number);return(h>12?h-12:h||12)+':'+String(m).padStart(2,'0')+' '+(h>=12?'p. m.':'a. m.')}function cycleState(id){let s=getState(),cur=s[id]?.state||'pending',next=cur==='pending'?'present':cur==='present'?'na':'pending';s[id]={state:next,arrival:next==='present'?new Date().toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit'}):''};setState(s);render()}function resetToday(){if(confirm('¿Reiniciar los estados de hoy?')){localStorage.removeItem(DAYKEY(today));render();document.getElementById('report').textContent='Día reiniciado.'}}function openModal(c){document.getElementById('modal').innerHTML=c;document.getElementById('modalBg').style.display='block'}function closeModal(){document.getElementById('modalBg').style.display='none';document.getElementById('modal').innerHTML=''}document.getElementById('modalBg').addEventListener('click',e=>{if(e.target.id==='modalBg')closeModal()});
function settings(){openModal(`<h2>⚙️ Configuración</h2><div class="card"><button class="primary" onclick="openEntities()">🏢 Entidades, ubicaciones y horarios</button></div><div class="card"><button class="primary" onclick="openTemplates()">💬 Plantillas de mensajes</button></div><div class="card"><button class="secondary" onclick="exportConfiguration()">⬇️ Exportar configuración</button> <button class="secondary" onclick="document.getElementById('importFile').click()">⬆️ Importar configuración</button><input id="importFile" type="file" accept=".json" style="display:none" onchange="importConfiguration(event)"></div><button class="danger" onclick="closeModal()">Cerrar</button>`)}function openEntities(){let rows=config.map(e=>`<div class="listitem"><span><b>${esc(e.name)}</b><br><span class="small">${esc(e.location)} · ${esc(e.time)}</span></span><button class="secondary" onclick="editEntity(${e.id})">Editar</button></div>`).join('');openModal(`<h2>🏢 Entidades</h2><input class="search" id="entitySearch" placeholder="Buscar entidad..." oninput="filterEntities()"><div id="entityList">${rows}</div><button class="secondary" onclick="addEntity()">➕ Agregar</button> <button class="danger" onclick="closeModal()">Cerrar</button>`)}function filterEntities(){let q=document.getElementById('entitySearch').value.toLowerCase();document.querySelectorAll('#entityList .listitem').forEach(x=>x.style.display=x.textContent.toLowerCase().includes(q)?'flex':'none')}function editEntity(id){let e=config.find(x=>x.id===id);if(!e)return;openModal(`<h2>✏️ Editar entidad</h2><label>Nombre</label><input id="en" value="${esc(e.name)}"><div class="row"><div><label>Ubicación</label><input id="el" value="${esc(e.location)}"></div><div><label>Hora</label><input id="et" type="time" value="${esc(e.time)}"></div></div><br><button class="primary" onclick="saveEntityEdit(${id})">Guardar</button> <button class="secondary" onclick="openEntities()">Volver</button> <button class="danger" onclick="closeModal()">Cerrar</button>`)}function saveEntityEdit(id){let e=config.find(x=>x.id===id);if(!e)return;e.name=document.getElementById('en').value.trim();e.location=document.getElementById('el').value.trim();e.time=document.getElementById('et').value;saveConfig();toast('✅ Cambios guardados correctamente');render();setTimeout(()=>editEntity(id),100)}function addEntity(){let id=Math.max(0,...config.map(e=>Number(e.id)||0))+1;config.push({id,name:'Nueva entidad',location:'',time:'07:00'});saveConfig();toast('✅ Entidad agregada');editEntity(id)}
function openTemplates(){let rows=templates.map((t,i)=>`<div class="listitem"><span><b>${esc(t.name)}</b><br><span class="small">${esc(t.text)}</span></span><button class="secondary" onclick="editTemplate(${i})">Editar</button></div>`).join('');openModal(`<h2>💬 Plantillas de mensajes</h2><input class="search" id="templateSearch" placeholder="Buscar plantilla..." oninput="filterTemplates()"><div id="templateList">${rows}</div><button class="primary" onclick="addTemplate()">➕ Agregar</button> <button class="danger" onclick="closeModal()">Cerrar</button>`)}function filterTemplates(){let q=document.getElementById('templateSearch').value.toLowerCase();document.querySelectorAll('#templateList .listitem').forEach(x=>x.style.display=x.textContent.toLowerCase().includes(q)?'flex':'none')}function editTemplate(i){let t=templates[i];openModal(`<h2>✏️ Editar plantilla</h2><label>Nombre</label><input id="tn" value="${esc(t.name)}"><label>Texto</label><textarea id="tt" rows="7">${esc(t.text)}</textarea><br><button class="primary" onclick="saveTemplate(${i})">Guardar</button> <button class="secondary" onclick="openTemplates()">Volver</button> <button class="danger" onclick="deleteTemplate(${i})">Eliminar</button> <button class="secondary" onclick="closeModal()">Cerrar</button>`)}function saveTemplate(i){templates[i]={name:document.getElementById('tn').value.trim(),text:document.getElementById('tt').value};saveTemplates();toast('✅ Plantilla guardada correctamente');openTemplates()}function addTemplate(){templates.push({name:'Nueva plantilla',text:''});saveTemplates();editTemplate(templates.length-1)}function deleteTemplate(i){if(confirm('¿Eliminar esta plantilla?')){templates.splice(i,1);saveTemplates();openTemplates();toast('✅ Plantilla eliminada')}}function openTemplateSelector(){let opts=templates.map((t,i)=>`<button class="secondary" style="display:block;width:100%;margin:7px 0;text-align:left" onclick="generateReport(${i})">${esc(t.name)}</button>`).join('');openModal(`<h2>💬 Seleccionar plantilla</h2>${opts}<button class="danger" onclick="closeModal()">Cerrar</button>`)}function generateReport(i){let t=templates[i],states=getState(),pending=config.filter(e=>(states[e.id]?.state||'pending')==='pending').map(e=>e.name),text=t.text+(pending.length?'\n\n'+pending.map(n=>'• '+n).join('\n'):'');document.getElementById('report').textContent=text;localStorage.setItem(SKEY,String(i));closeModal()}function exportConfiguration(){let data={version:4,entities:config,templates:templates,selectedTemplate:localStorage.getItem(SKEY)||'0'},blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='control-presencia-configuracion.json';a.click();URL.revokeObjectURL(a.href)}function importConfiguration(ev){let f=ev.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(Array.isArray(d.entities))config=normalize(d.entities);if(Array.isArray(d.templates))templates=d.templates;saveConfig();saveTemplates();toast('✅ Configuración importada');render();closeModal()}catch(e){alert('Archivo de configuración no válido.')}};r.readAsText(f)}render();
</script></body></html>
